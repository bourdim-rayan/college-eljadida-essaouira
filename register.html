<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب تلميذ - الثانوية الإعدادية الجديدة</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <img class="brand-emblem" src="assets/logo-white.png" alt="شعار الثانوية الإعدادية الجديدة" style="margin-bottom:20px;;height:72px;width:auto;">
    <h2>ثلاث خطوات لفتح فضائك الشخصي</h2>
    <div class="steps steps-vertical" style="margin-top:22px;">
      <div class="step active"><span class="n">1</span><div><b>أنشئ حسابك</b><small>الاسم والبريد وكلمة المرور</small></div></div>
      <div class="step"><span class="n">2</span><div><b>أرسل طلب فتح الملف</b><small>معطياتك المدرسية ورقم مسار</small></div></div>
      <div class="step"><span class="n">3</span><div><b>موافقة الإدارة</b><small>بعدها تُفتح لك كل الفضاءات</small></div></div>
    </div>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-form" onsubmit="return handleRegister(event)">
      <a href="login.html" style="display:inline-block;margin-bottom:22px;color:var(--blue-600);font-weight:700;font-size:13.5px;">⟵ العودة إلى تسجيل الدخول</a>
      <h2>إنشاء حساب تلميذ(ة)</h2>
      <p style="color:var(--ink-600);margin-bottom:22px;">بعد إنشاء الحساب ستُطلب منك معطياتك المدرسية لترسلها إلى الإدارة.</p>

      <div class="form-error" id="registerError"></div>

      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input type="text" id="fullName" placeholder="الاسم والنسب" required>
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="6 أحرف على الأقل" required minlength="6">
      </div>
      <div class="field">
        <label for="password2">تأكيد كلمة المرور</label>
        <input type="password" id="password2" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">إنشاء الحساب</button>
    </form>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/site-info.js"></script>
</body>
</html>
