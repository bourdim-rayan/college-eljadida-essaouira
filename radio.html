<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإذاعة المدرسية - الثانوية الإعدادية الجديدة</title>

<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img class="brand-emblem" src="assets/logo-white.png" alt="شعار الثانوية الإعدادية الجديدة">
      <span class="brand-text"><strong data-school="name">الثانوية الإعدادية الجديدة</strong><span data-school="tagline">الصويرة - المملكة المغربية</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="journal.html">المجلة والصحافة</a>
      <a href="clubs.html">الأندية</a>
      <a href="radio.html" class="active">الإذاعة</a>
      <a href="schedule.html">استعمال الزمن</a>
      <a href="news.html">الأخبار</a>
    </nav>
    <div class="header-actions">
      <button class="lang-switch" type="button">AR / FR / EN</button>
      <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
      <button class="burger" onclick="toggleMenu()" aria-label="القائمة"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section" style="padding-top:40px;">
  <div class="container" style="max-width:900px;">
    <div class="section-head"><div><h2>📻 الإذاعة المدرسية</h2><p>استمع إلى أثير الإذاعة: لقاءات وندوات على الهواء مباشرة من المؤسسة.</p></div></div>
    <div id="onAir"></div>
    <div id="memberOnly"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none;padding-top:0;">
    <span data-school="copyright">© 2026 الثانوية الإعدادية الجديدة - الصويرة. جميع الحقوق محفوظة.</span>
    <a href="#top" class="back-top">↑</a>
  </div>
</footer>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/site-info.js"></script>
<script src="js/media-store.js"></script>
<script src="js/radio-live.js"></script>
<script src="js/radio-ui.js"></script>
<script>
  const ME = (function () { try { return JSON.parse(sessionStorage.getItem("currentUser") || "null"); } catch (e) { return null; } })();
  let st = { connected: false, live: false }, listener = null;

  function paintOnAir() {
    const box = document.getElementById("onAir");
    if (st.error && !st.connected) { box.innerHTML = `<div class="alert alert-yellow">📡 ${esc(st.error)}</div>`; return; }
    if (!st.connected) { box.innerHTML = `<div class="alert alert-blue">⏳ جارٍ الاتصال بأثير الإذاعة...</div>`; return; }
    if (!st.live) { box.innerHTML = `<div class="panel" style="text-align:center;"><div style="font-size:42px;">📻</div><h3 style="margin:6px 0;">لا يوجد بث مباشر الآن</h3><p class="empty-note" style="margin:0;">سيبدأ الاستماع تلقائيًا بعد أن يبدأ المذيع. اترك الصفحة مفتوحة.</p></div>`; return; }
    const playing = !!st.playing;
    box.innerHTML = `<div class="panel" style="border:2px solid var(--danger);">
      <div class="panel-head"><h3>🔴 على الهواء الآن: ${esc(st.title)}</h3><span class="badge badge-red">مباشر</span></div>
      <p style="margin:0 0 12px;color:var(--ink-600);font-size:13.5px;">المذيع: ${esc(st.host)} • 👥 ${esc(st.listeners || 0)} مستمع</p>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <button class="btn ${playing ? "btn-ghost" : "btn-primary"} btn-lg" type="button" id="playBtn" onclick="togglePlay()">${playing ? "⏸ إيقاف الاستماع" : "▶ استمع الآن"}</button>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;">🔊 <input type="range" min="0" max="1" step="0.05" value="1" oninput="listener.setVolume(this.value)" style="width:140px;"></label>
      </div></div>`;
  }
  function togglePlay() { if (st.playing) listener.pause(); else listener.play(); }

  function paintMembers() {
    const box = document.getElementById("memberOnly");
    if (!ME) { box.innerHTML = `<div class="alert alert-blue" style="margin-top:20px;">🔒 البرنامج القادم وأرشيف التسجيلات للمسجَّلين. <a href="login.html" style="font-weight:700;text-decoration:underline;">سجّل الدخول</a>.</div>`; return; }
    DB = loadDB();
    const up = DB.broadcasts.filter(b => b.status === "scheduled" || b.status === "live").sort((a, c) => a.scheduledAt.localeCompare(c.scheduledAt));
    const ar = DB.broadcasts.filter(b => b.status === "ended").sort((a, c) => (c.endedAt || "").localeCompare(a.endedAt || ""));
    box.innerHTML = `<h3 style="margin:26px 0 10px;font-family:var(--font-display);color:var(--blue-800);">🗓️ البرنامج القادم</h3>` +
      (up.length ? up.map(b => `<div class="club-row"><div><b>${esc(b.title)}</b> <span class="badge badge-blue">${esc(b.type)}</span>
        <div style="font-size:12.5px;color:var(--ink-600);">📅 ${esc(fmtWhen(b.scheduledAt))}${b.guests ? " • " + esc(b.guests) : ""} • ${esc(b.hostName)}</div>
        <div style="font-size:13px;margin-top:4px;">${esc(b.description)}</div></div></div>`).join("") : `<p class="empty-note">لا توجد بثوث مبرمجة.</p>`) +
      `<h3 style="margin:26px 0 10px;font-family:var(--font-display);color:var(--blue-800);">🎞️ الأرشيف</h3><div id="archive">` +
      (ar.length ? ar.map(b => `<div class="panel"><div class="panel-head"><h3 style="font-size:15px;">${esc(b.title)}</h3><span class="badge badge-green">${esc(b.type)}</span></div>
        <div style="font-size:12.5px;color:var(--ink-600);margin-bottom:6px;">${esc(b.endedAt || fmtWhen(b.scheduledAt))}${b.guests ? " • " + esc(b.guests) : ""}</div>
        ${broadcastRecordingHTML(b) || '<p class="empty-note">لم يُضَف تسجيل لهذا البث.</p>'}</div>`).join("") : `<p class="empty-note">لا توجد تسجيلات بعد.</p>`) + `</div>`;
    hydrateMedia(box);
  }

  listener = new RadioListener(s => { st = s; paintOnAir(); });
  paintOnAir(); paintMembers();
</script>
</body>
</html>
